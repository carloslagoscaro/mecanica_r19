<script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzq9tEOenVdEuZESIqKNA1Wa648Iul0oBvBRPdxnwYIZY6hJNFr5nnJhrh85vtiu0QBuA/exec"; 
        const WHATSAPP_TALLER = "56932291414";
        const CLAVE_MECANICO = "R19admin";
        const BLOQUES_HORARIOS = ["09:00", "10:30", "12:00", "14:30", "16:00", "17:30"];

        let reservasGlobales = [];

        const inputFecha = document.getElementById('fechaAgenda');
        const hoyISO = new Date().toISOString().split('T')[0];
        inputFecha.min = hoyISO;
        inputFecha.value = hoyISO;

        window.addEventListener('DOMContentLoaded', () => {
            cargarReservas();
        });

        inputFecha.addEventListener('change', () => {
            document.getElementById('horaSeleccionada').value = "";
            document.getElementById('resumenSeleccion').classList.add('hidden');
            renderizarHorarios();
        });

        async function cargarReservas() {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                reservasGlobales = await res.json();
            } catch (error) {
                console.error("Error leyendo Google Sheets:", error);
            } finally {
                renderizarHorarios();
                renderizarTablaMecanico();
            }
        }

        function renderizarHorarios() {
            const fechaElegida = inputFecha.value;
            const grid = document.getElementById('gridHorarios');
            const horaActualInput = document.getElementById('horaSeleccionada').value;
            
            grid.innerHTML = "";

            const ocupadasEseDia = reservasGlobales
                .filter(r => r.fecha === fechaElegida)
                .map(r => r.hora);

            BLOQUES_HORARIOS.forEach(hora => {
                const estaOcupado = ocupadasEseDia.includes(hora);
                const estaSeleccionado = horaActualInput === hora;

                const btn = document.createElement('button');
                btn.type = "button";

                if (estaOcupado) {
                    btn.disabled = true;
                    btn.className = "py-3 px-3 rounded-xl border border-rose-500/30 bg-rose-950/30 text-rose-400/70 text-xs font-bold cursor-not-allowed flex flex-col items-center";
                    btn.innerHTML = `<span>${hora}</span><span class="text-[10px] uppercase mt-0.5">Ocupado</span>`;
                } else {
                    btn.className = estaSeleccionado
                        ? "py-3 px-3 rounded-xl border-2 border-amber-400 bg-amber-400/20 text-white text-xs font-extrabold flex flex-col items-center transition"
                        : "py-3 px-3 rounded-xl border border-emerald-500/40 bg-emerald-950/20 hover:bg-emerald-500/20 text-emerald-300 text-xs font-bold flex flex-col items-center transition";
                    btn.innerHTML = `<span>${hora}</span><span class="text-[10px] uppercase mt-0.5 text-emerald-400">Disponible</span>`;
                    
                    btn.onclick = () => seleccionarBloque(hora);
                }
                grid.appendChild(btn);
            });
        }

        function seleccionarBloque(hora) {
            document.getElementById('horaSeleccionada').value = hora;
            const resumen = document.getElementById('resumenSeleccion');
            const texto = document.getElementById('textoResumenHora');
            
            texto.textContent = `${inputFecha.value} a las ${hora} hrs`;
            resumen.classList.remove('hidden');
            renderizarHorarios();
        }

        function elegirYAgendar(servicio) {
            document.getElementById('servicioSelect').value = servicio;
            document.getElementById('agenda').scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('formReserva').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fecha = inputFecha.value;
            const hora = document.getElementById('horaSeleccionada').value;

            if (!hora) {
                alert("Por favor, selecciona un bloque horario disponible antes de confirmar.");
                return;
            }

            const btn = document.getElementById('btnConfirmar');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Guardando en Planilla...`;

            const nuevaReserva = {
                fecha: fecha,
                hora: hora,
                cliente: document.getElementById('clienteNombre').value.trim(),
                telefono: document.getElementById('clienteTelefono').value.trim(),
                vehiculo: document.getElementById('clienteVehiculo').value.trim(),
                servicio: document.getElementById('servicioSelect').value,
                detalle: document.getElementById('clienteDetalle').value.trim()
            };

            try {
                // Envío directo a Google Sheets
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(nuevaReserva)
                });

                // Pausa breve para que Google registre la fila
                await new Promise(r => setTimeout(r, 1500));
                await cargarReservas();

                let msg = `Hola *R19 Mecánica Automotriz*, he agendado una hora en la web:%0A%0A`;
                msg += `*Fecha:* ${fecha}%0A`;
                msg += `*Hora:* ${hora} hrs%0A`;
                msg += `*Cliente:* ${nuevaReserva.cliente}%0A`;
                msg += `*Vehículo:* ${nuevaReserva.vehiculo}%0A`;
                msg += `*Servicio:* ${nuevaReserva.servicio}%0A`;
                if (nuevaReserva.detalle) msg += `*Detalle:* ${nuevaReserva.detalle}%0A`;

                alert("¡Reserva guardada con éxito en la planilla y disponible en la agenda!");
                window.open(`https://wa.me/${WHATSAPP_TALLER}?text=${msg}`, '_blank');

                this.reset();
                document.getElementById('horaSeleccionada').value = "";
                document.getElementById('resumenSeleccion').classList.add('hidden');
                inputFecha.value = hoyISO;
                renderizarHorarios();

            } catch (err) {
                alert("Error al conectar con la planilla. Intenta de nuevo.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-calendar-check"></i> Confirmar Reserva`;
            }
        });

        function abrirPanelMecanico() {
            const pass = prompt("Ingresa la clave de acceso del taller:");
            if (pass === CLAVE_MECANICO) {
                document.getElementById('modalMecanico').classList.remove('hidden');
                cargarReservas();
            } else if (pass !== null) {
                alert("Clave incorrecta.");
            }
        }

        function cerrarPanelMecanico() {
            document.getElementById('modalMecanico').classList.add('hidden');
        }

        function renderizarTablaMecanico() {
            const tbody = document.getElementById('tablaCitasMecanico');
            const filtroFecha = document.getElementById('filtroFechaMecanico').value;
            tbody.innerHTML = "";

            let filtradas = [...reservasGlobales];
            if (filtroFecha) {
                filtradas = filtradas.filter(r => r.fecha === filtroFecha);
            }

            filtradas.sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));

            if (filtradas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-500">No hay horas agendadas para mostrar.</td></tr>`;
                return;
            }

            filtradas.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5";
                tr.innerHTML = `
                    <td class="py-3 px-3 font-semibold text-white">${r.fecha}</td>
                    <td class="py-3 px-3"><span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-bold">${r.hora}</span></td>
                    <td class="py-3 px-3 text-purple-300 font-semibold">${r.servicio}</td>
                    <td class="py-3 px-3">${r.vehiculo}</td>
                    <td class="py-3 px-3">${r.cliente}</td>
                    <td class="py-3 px-3">
                        <a href="https://wa.me/${r.telefono.replace(/\D/g,'')}" target="_blank" class="text-emerald-400 hover:underline">
                            <i class="fa-brands fa-whatsapp"></i> ${r.telefono}
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
